name: História de usuário
description: Item do backlog no modelo de User Story da disciplina
title: "[US-XX] Título curto da funcionalidade"
labels: ["user-story"]
body:
  - type: markdown
    attributes:
      value: |
        O backlog oficial fica no Jira (espaço GK). Este modelo é o mesmo usado nas histórias do Jira.
        O número da US é o da chave no Jira (GK-7 = US-07).
  - type: input
    id: epico
    attributes:
      label: Feature / Épico
      placeholder: "Conta e acesso (GK-1)"
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release
      options: ["R1", "R2", "R3", "R4"]
  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: "0 a 7"
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options: ["Alta", "Média", "Baixa"]
  - type: dropdown
    id: pontos
    attributes:
      label: Story Points
      options: ["1", "2", "3", "5", "8", "13"]
  - type: input
    id: responsavel
    attributes:
      label: Responsável
      placeholder: "@usuario-github"
  - type: dropdown
    id: revisao
    attributes:
      label: Papel de revisão
      options: ["QA", "PO"]
  - type: textarea
    id: historia
    attributes:
      label: História de usuário
      value: |
        Eu como <perfil de usuário>,
        preciso <ação ou funcionalidade>,
        de modo que <benefício ou valor de negócio>.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto e observações (opcional)
      placeholder: "Regras de negócio, protótipos, links, dependências de outras US"
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      value: |
        Cenário 1: <situação principal (caminho feliz)>
          Dado que <contexto inicial>
          Quando <ação do usuário>
          Então <resultado esperado>

        Cenário 2: <situação alternativa ou de erro>
          Dado que <contexto inicial>
          Quando <ação do usuário>
          Então <resultado esperado>
          E <resultado adicional, se houver>
    validations:
      required: true
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready (DoR) - preencher antes da Sprint Planning
      options:
        - label: História escrita no formato "Eu como... preciso... de modo que..."
        - label: Critérios de aceite escritos em Gherkin
        - label: Estimativa de Story Points definida pela equipe
        - label: Prioridade definida pelo PO
        - label: Dependências identificadas
        - label: Cabe em uma sprint
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done (DoD) - conferir na Sprint Review
      options:
        - label: Código revisado e integrado via Pull Request
        - label: Critérios de aceite atendidos e validados pelo QA
        - label: Testes escritos e passando
        - label: Pipeline de CI sem falhas
        - label: Implantado em ambiente de homologação (quando exigido na release)
        - label: Documentação atualizada
        - label: Aceita pelo PO
