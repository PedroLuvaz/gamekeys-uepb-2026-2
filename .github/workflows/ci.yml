name: CI

# Build e testes a cada push, em qualquer branch, e em todo pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Conferir TypeScript e gerar front-end
        run: pnpm build
      - name: Testar catálogo com Cypress/Cucumber e API simulada
        run: |
          pnpm dev > /tmp/gamekeys-vite.log 2>&1 &
          pnpm test:e2e
      - name: Guardar evidências de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-interface
          path: |
            frontend/cypress/reports/
            frontend/cypress/screenshots/
          if-no-files-found: warn

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL efêmero do próprio job: credenciais só de CI, sem segredo real.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gamekeys
          POSTGRES_PASSWORD: gamekeys
          POSTGRES_DB: gamekeys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamekeys -d gamekeys"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: gamekeys
      PGPASSWORD: gamekeys
      PGDATABASE: gamekeys
      DATABASE_URL: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys
      DATABASE_URL_UNPOOLED: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys
      TEST_DATABASE_URL: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys_teste
      # Valor exclusivo do ambiente efêmero de CI; não é credencial de produção.
      JWT_SECRET: gamekeys-ci-chave-efemera-com-mais-de-32-bytes
      JWT_DURACAO_MINUTOS: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Criar banco de testes
        run: psql -c "create database gamekeys_teste"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff)
        run: ruff format --check .

      - name: Migrações e carga de demonstração
        run: python -m app.migrar --carga

      # Plano de Teste: smoke a cada push; o conjunto completo é a regressão da release.
      - name: Smoke (pytest -m smoke)
        run: pytest -m smoke -v --junitxml=relatorios/smoke.xml

      - name: Testes completos (pytest)
        run: pytest -v --junitxml=relatorios/pytest.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Preparar interface para integração real
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Identificar jogo inativo na carga local (GK-10)
        working-directory: .
        run: |
          jogo_inativo_id=$(psql -tAc "select id from catalogo.jogos where not ativo order by id limit 1")
          test -n "$jogo_inativo_id"
          echo "GAMEKEYS_JOGO_INATIVO_ID=$jogo_inativo_id" >> "$GITHUB_ENV"
      - name: Verificar tela, API e PostgreSQL integrados
        working-directory: frontend
        run: |
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/gamekeys-api.log 2>&1) &
          pnpm dev > /tmp/gamekeys-vite.log 2>&1 &
          node scripts/aguardar-api.mjs
          pnpm test:integracao
      - name: Guardar evidências de integração real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-integracao-real
          path: |
            frontend/cypress/reports/
            frontend/cypress/screenshots/
          if-no-files-found: warn

      - name: Guardar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: backend/relatorios/
          if-no-files-found: warn

      - name: Dados continuam no banco depois de reiniciar
        working-directory: .
        run: |
          docker restart ${{ job.services.postgres.id }}
          until pg_isready -q; do sleep 1; done
          jogos=$(psql -tAc "select count(*) from catalogo.jogos")
          echo "jogos depois de reiniciar: $jogos"
          test "$jogos" = "24"

  imagens:
    name: imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O compose exige o .env.local; no CI ele fica vazio, porque só as imagens são geradas.
      - name: Gerar imagens da API e do front-end
        run: |
          touch .env.local
          docker compose build
