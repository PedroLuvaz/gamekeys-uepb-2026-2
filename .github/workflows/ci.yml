name: CI

# Build e testes a cada push, em qualquer branch, e em todo pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Conferir TypeScript e gerar front-end
        run: pnpm build
      - name: Testar catálogo com Cypress/Cucumber e API simulada
        run: |
          pnpm dev > /tmp/gamekeys-vite.log 2>&1 &
          pnpm test:e2e
      - name: Guardar evidências de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-interface
          path: |
            frontend/cypress/reports/
            frontend/cypress/screenshots/
          if-no-files-found: warn

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Banco local do docker-compose.yml: credenciais só de CI, sem segredo real.
    env:
      DATABASE_URL: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys
      DATABASE_URL_UNPOOLED: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys
      TEST_DATABASE_URL: postgresql://gamekeys:gamekeys@localhost:5432/gamekeys_teste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Subir PostgreSQL (Docker Compose)
        working-directory: .
        run: docker compose up -d --wait

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff)
        run: ruff format --check .

      - name: Migrações e carga de demonstração
        run: python -m app.migrar --carga

      # Plano de Teste: smoke a cada push; o conjunto completo é a regressão da release.
      - name: Smoke (pytest -m smoke)
        run: pytest -m smoke -v --junitxml=relatorios/smoke.xml

      - name: Testes completos (pytest)
        run: pytest -v --junitxml=relatorios/pytest.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Preparar interface para integração real
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verificar tela, API e PostgreSQL integrados
        working-directory: frontend
        run: |
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/gamekeys-api.log 2>&1) &
          pnpm dev > /tmp/gamekeys-vite.log 2>&1 &
          node scripts/aguardar-api.mjs
          pnpm test:integracao
      - name: Guardar evidências de integração real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-integracao-real
          path: |
            frontend/cypress/reports/
            frontend/cypress/screenshots/
          if-no-files-found: warn

      - name: Guardar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: backend/relatorios/
          if-no-files-found: warn

      - name: Dados continuam no banco depois de reiniciar
        working-directory: .
        run: |
          docker compose down
          docker compose up -d --wait
          jogos=$(docker compose exec -T postgres psql -U gamekeys -d gamekeys -tAc "select count(*) from catalogo.jogos")
          echo "jogos depois de reiniciar: $jogos"
          test "$jogos" = "24"
