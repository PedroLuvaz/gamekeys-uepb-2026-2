# PostgreSQL exclusivamente local e descartável para testes automatizados (GK-106).
# Não usa .env.local nem se conecta ao Neon.

services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gamekeys
      POSTGRES_PASSWORD: gamekeys
      POSTGRES_DB: gamekeys_teste
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamekeys -d gamekeys_teste"]
      interval: 2s
      timeout: 5s
      retries: 30
