# API e front-end em contêineres, usando o banco do Neon configurado no .env.local.
# O banco não roda aqui: o CI usa um PostgreSQL próprio do GitHub Actions.
#   docker compose up --build -d    sobe a API (8000) e o front-end (8080)
#   docker compose logs -f api      acompanha a API
#   docker compose down             para os dois

services:
  api:
    build: ./backend
    env_file: .env.local
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
