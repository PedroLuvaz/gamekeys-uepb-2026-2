# PostgreSQL local (GK-91), alternativa ao Neon e banco usado pelo CI.
# Credenciais só de desenvolvimento: não são as do Neon e não protegem nada fora da sua máquina.
#   docker compose up -d --wait     sobe o banco (os dados ficam no volume dados_postgres)
#   docker compose down             para sem apagar os dados (down -v apaga o volume)

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gamekeys
      POSTGRES_PASSWORD: gamekeys
      POSTGRES_DB: gamekeys
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql
      - ./backend/docker/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/01-banco-de-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamekeys -d gamekeys"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dados_postgres:
